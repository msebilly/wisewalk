name: WiseWalk

options:
  bundleIdPrefix: com.msebilly
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  WiseWalk:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msebilly.wisewalk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 慧行
        # ⛔ 不声明语言的话，凡是**系统自己画**的东西全走英文：
        # `EditButton()` 是 `Edit`、`DatePicker` 写 `Jul 31, 2026`、
        # `.alert` 自动补的那个按钮叫 `Cancel`（那一个还会把界面点死，见 `postpone()`）。
        # 自己写的文案再怎么斟酌也盖不住——同一屏上「7 月 31 日 星期五」
        # 和 `Jul 31, 2026` 并排出现过。面向的是汉传佛教在家居士。
        DEVELOPMENT_LANGUAGE: zh-Hans
        INFOPLIST_KEY_CFBundleLocalizations: zh-Hans
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        # ⛔ 这行在本机上不产生任何效果——entitlements 只在**签名那一刻**被读，
        # 而上一行把签名整个关了。它进仓库是为了付费账号到位那天不用现补，
        # 以及把「容器 ID 是什么」写在一个查得到的地方。
        # 文件头有更长的说明：这些 entitlements 在没有付费账号时从未实际执行；
        # 真机验证之前，任何「同步已就绪」的说法都是编的。
        CODE_SIGN_ENTITLEMENTS: WiseWalk.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  WiseWalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: WiseWalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msebilly.wisewalk.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  WiseWalk:
    build:
      targets:
        WiseWalk: all
    test:
      targets:
        - WiseWalkTests
    run:
      config: Debug
