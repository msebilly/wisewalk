# 装上 App 头一天：空态 → 引导 → 立第一门课 → **当天就得能记**。
#
# 守的是 `578d9aa`：从前这一门课不进今天的清单，用户装上当天
# **根本记不了**——计数器的入口只在功课行上，行都没有就点不进去。
# 单元测试 `装上头一天立的第一门课当天就得能记` 守着数据层那一半，
# 这条守屏幕上真的出现了那一行。
#
# 顺带守 `2cded4f`：「立一门定课」从前跳到一个反而没有引导的空页。
appId: com.msebilly.wisewalk
---
- launchApp: { clearState: true }
- assertVisible: "还没有定课"
- tapOn: "立一门定课"
# 引导不许在第二页断掉——他刚点了「立一门定课」，这一页就得让他立得成。
- assertVisible: "从模板选一样"
- tapOn: "从模板选一样"
- tapOn: "念佛"
- tapOn: { point: "10%,10%" }
# ⭐ 今天立的头一门课，今天就得出现在清单上。
- assertVisible: "念佛"
- assertNotVisible: "还没有定课"
