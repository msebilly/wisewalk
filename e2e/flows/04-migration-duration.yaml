# 迁移页问「以往累计」时，计时类必须按【时+分】问。
#
# 守的是 `6c12439`：从前这里是一个裸数字框，而 `amount` 对计时类是**秒**。
# 打坐三十年、累计 5000 小时的人填 5000，记进去是 5000 秒 = 1 小时 23 分。
# **丢掉 3599/3600，方向是「丢」，而且必然发生**——框上一个字都没说要填秒。
#
# 顺带守 `9802c5d`：`tapOn: "小时"` 能点中，等于验了那两个框的无障碍标签还在。
# **Maestro 点不着的东西，读屏软件也念不出来。**
appId: com.msebilly.wisewalk
---
- runFlow: subflows/new-duration-item.yaml
- tapOn: { point: "10%,10%" }
- swipe: { start: "50%,80%", end: "50%,20%" }
- swipe: { start: "50%,80%", end: "50%,20%" }
- swipe: { start: "50%,80%", end: "50%,20%" }
- tapOn: "记入以往的累计"
# ⭐ 计时类必须问时分。问一个裸数字框就是在问秒。
- assertVisible: "小时"
- assertVisible: "分"
- tapOn: "小时"
- inputText: "3"
- tapOn: "记上"
# ⭐ `08fb0ba`：「只需做一次」那句注脚从前没有任何代码兑现。
# 再打开一次，必须把已经记过的数摆出来。
- swipe: { start: "50%,80%", end: "50%,20%" }
- swipe: { start: "50%,80%", end: "50%,20%" }
- swipe: { start: "50%,80%", end: "50%,20%" }
- tapOn: "记入以往的累计"
- assertVisible: ".*已经记过以往累计 3 小时.*"
