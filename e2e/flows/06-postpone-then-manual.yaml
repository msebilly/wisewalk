# 06 —— 「以后再说」之后他自己补记了一遍，再问时不能还说「有一笔没记上」。
#
# 由 `06-postpone.sh` 驱动（草稿得先造出来）。守 `837ebc1`。
#
# 这条路 `postpone()` 的注释里写了很久，一直当作已知取舍：
#   「用户推迟之后可能自己手动补记一遍，下次启动又被问同一份。那时他该点『不记了』。」
# **可他凭什么知道？** 屏幕上写的是「有一笔没记上」，而那时这句话已经是假话。
# 对假话最自然的反应就是点「记上」——同一笔进两回账。
appId: com.msebilly.wisewalk
---
- launchApp: { clearState: false }
- assertVisible: "有一笔没记上"
# 头一回问的时候账上确实什么都没有，就不该无中生有说一句。
- assertNotVisible: ".*另外已经记了.*"
- tapOn: "以后再说"
# 他以为没记上，自己去补记页记一遍 108 声。
- tapOn: { point: "10%,10%" }
# ⚠️ 这里只能用坐标。`.accessibilityLabel("数量")` 之后页面上有**两个**「数量」
# （可见的 `Text` 和框自己的标签），文本选择器挑中的是那个 `Text`，点了不聚焦。
# 这是测试的歧义，不是 App 的缺陷——VoiceOver 读到框时说的是「数量, 0」，正是要的。
- tapOn: { point: "88%,35%" }
- inputText: "108"
# `hideKeyboard` 在这张表单上失败，点标题收键盘。
- tapOn: "补记一笔"
- tapOn: "记上"
- tapOn: "好"
- stopApp
- launchApp: { clearState: false }
- assertVisible: "有一笔没记上"
# ⭐ 这一句就是整条 flow 的理由：他已经自己记过了，这个数必须摆到他眼前。
- assertVisible: ".*另外已经记了 108 声.*"
# ⚠️ 只摆事实，不出主意：App 分不清「他补记过这一笔」和「那天另有一坐」。
# 早课记完 108、晚上又念到 50 时崩溃，那 108 是另一坐，该点的是「记上」。
- assertNotVisible: ".*就点.*"
- assertNotVisible: ".*建议.*"
