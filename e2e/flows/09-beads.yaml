# 拨念珠念的那些，一次记进来。
#
# 念佛不一定开着 App——**拨念珠是常态，App 反而是辅助**。
# 一串 108 颗，拨完 3 串是 324 声。这条 flow 走的就是他做完功课才打开 App 的那条路。
#
# 两件此前没有的事：
# ① 批量增加有了**看得见的按钮**（从前只有长按，而读屏用户做不出长按）；
# ② 「自定」能用键盘打数（从前是 `Stepper`，从 108 调到 324 要点 216 下）。
appId: com.msebilly.wisewalk
---
- runFlow: subflows/new-count-item.yaml
- tapOn: "念佛"
# 先点 1 下，末了必须是 1 + 324。只验 324 的话，
# 「批量把之前的数冲掉了」这种走样照样绿。
- tapOn: { point: "50%,45%" }
- assertVisible: "本次 1"

# ① 看得见的入口。不是长按——长按对读屏用户等于不存在。
- tapOn: "加一批"
- assertVisible: "一次加多少"
# 此刻框里**预填着默认档 108**。下面那条断言全靠这个前提。
- assertVisible: "加 108"

# ② 键盘打数。
- tapOn: "自定数量"
- inputText: "324"
# ⛔⛔ **这两条拦的是「多记三千倍」。**
# 框里预填着 108，光标落在它**前面**就拼成 `324108`——
# 实测截图拍到过，键上明明白白写着「加 324108」。
# `numericText` 只把 0 映射成空串，治不了「预填非 0 值」这一种；
# 真正拦住它的是 `BatchSheet` 里那句「点进来就清空」，
# 而那是 focus 交互，**单元测试够不着，这条 flow 是唯一的网**。
- assertVisible: "加 324"
- assertNotVisible: "加 324108"

- tapOn: "加 324"
- assertVisible: "本次 325"
- tapOn: "结束并记录"
- assertVisible: "325 声"
