# ⛔ **本目录存在的头号理由。** 由 `03-recovery.sh` 驱动——草稿得先造出来，
# 见那个脚本开头的说明（`stopApp` 不但留不下草稿，反而会把它提交掉）。
#
# 恢复弹窗上点一下就把整个 App 锁死，同一个病换过三条路径
# （`95ee7fc` / `fe8aeb6`），**没有一条是单元测试够得着的**：
#   1. `.constant` 作 isPresented，SwiftUI 关窗时写回 false 被丢弃
#   2. `accept()` 抛错留着 pending，可 alert 已经拆了
#   3. `true` 又写成 `true`，不算状态变化，第二份草稿不弹
# 三条的表征一模一样：弹窗没了，`.disabled(!isReady)` 却永远解不开，
# 今日页整个点不动，**只能杀 App**。
appId: com.msebilly.wisewalk
---
- launchApp: { clearState: false }
- assertVisible: "有一笔没记上"
# ⭐ 日期行不能少：不写记在哪一天，他没法判断该不该记。
# `.*x.*` 是因为 Maestro 的文本匹配是 **full-match regex**，
# 从长段落里挑一个词必须自己带通配。
- assertVisible: ".*记上会算在.*"
- assertVisible: ".*念佛.*"
# ⭐ 系统自动补的那个英文 Cancel 正是死锁的入口，一个字都不许出现。
- assertNotVisible: "Cancel"
- tapOn: "记上"
# ⭐⭐ **`fe8aeb6` 就死在这一步**：答完第一份，第二份必须接着弹。
# 从前 `showRecovery` 从 true 又写成 true，不算状态变化，SwiftUI 不重新呈现，
# 弹窗没了而 `.disabled` 还锁着——今日页整个点不动。
- assertVisible: "有一笔没记上"
- tapOn: "不记了"
- assertNotVisible: "有一笔没记上"
# ⭐⭐⭐ 死锁的判据：两份都答完之后，今日页**必须还点得动**。
- tapOn: "念佛"
- assertVisible: "念佛"
- tapOn: "结束并记录"
# 「记上」的那 108 声进了账，「不记了」的 21 声没进。
- assertVisible: "108 声"
